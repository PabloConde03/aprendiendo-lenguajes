<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>

    <h1>Contact</h1>
    <p>Contacta conmigo para lo que necesites:</p>

    <!-- Formulario de contacto -->
    <form action="mailto:pabloconde@example.com" method="post" enctype="text/plain">
        <label for="name">Nombre </label>
        <input type="text" id="name" name="name" required height="30" width="300"   >
        <br>
        <label for="email">Email@
        </label>
        <input type="email" id="email" name="email" required height="30" width="300"> 
        <br>
        <label for="message">Mensaje</label>
        <textarea id="message" name="message" required height="100" width="300" ></textarea>
        <br>
        <input type="submit" value="Enviar">
    </form>


    <!-- Métodos de contacto -->
    <ul>
        
        <li>LinkedIn: <a href="https://www.linkedin.com/in/pablo-conde-p%C3%A9rez-270008309" target="_blank">linkedin.com/in/pabloconde</a></li>
        <li>GitHub: <a href="https://github.com/PabloConde03" target="_blank">github.com/pabloconde</a></li>
    </ul>


</body>
</html>
