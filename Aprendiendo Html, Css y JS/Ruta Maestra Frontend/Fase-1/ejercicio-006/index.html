<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Bloques de Citas</title>
</head>
<body>
    <article>
        <h1>Citas célebres</h1>
        <blockquote cite="https://es.wikipedia.org/wiki/Isaac_Newton">
            <p>Yo puedo calcular el movimiento de los cuerpos celestes, pero no la locura de las personas.</p>
            <footer>— Isaac Newton</footer>
        </blockquote>
        <p>Como dijo <q>la ciencia avanza paso a paso</q>, cada descubrimiento abre nuevas preguntas.</p>
    </article>
</body>
</html>
